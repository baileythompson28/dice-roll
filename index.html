<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>dice game</title>
<link rel="stylesheet" href="style.css"> 
</head>
<body>
  <h1 id="title">Dice Game</h1>
  <p>roll your dice and try to get the highest score, but rolling a total of 7 will make you lose all your points.</p>
  <div id="game-container">
    <div id="dice1"></div>
    <div id="dice2"></div>
  </div>
  <button id="roll-button">roll dice</button>
  <button id="reset-button">reset game</button>
  <p id="diceResult"></p>
  <p id="score">Score: 0</p>
  <p id="rollsLeft">Rolls Left: 10</p>
</body>
<script src="app.js"></script>
</html>
